# BoT-SORT tracker config for the gaze-rules offline script.
# Tuned for STRIDED processing (--frame-stride 10 => the tracker only sees
# ~3 fps): lost tracks are kept alive much longer than the default 30 updates
# so a performer occluded by the crowd re-associates with the SAME id instead
# of inflating the id space, and association is slightly more lenient because
# inter-frame motion is ~10x larger than at native fps.
tracker_type: botsort
track_high_thresh: 0.5      # first-pass association confidence threshold
track_low_thresh: 0.1       # second-pass (low-conf) association threshold
new_track_thresh: 0.6       # min confidence to spawn a NEW id (curbs inflation)
track_buffer: 90            # keep lost tracks ~30 s at stride 10 (default 30)
match_thresh: 0.85          # more lenient IoU association for strided motion
fuse_score: True
gmc_method: sparseOptFlow   # camera is static; cheap global motion compensation
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False            # clothes-colour registry in the engine handles re-ID
